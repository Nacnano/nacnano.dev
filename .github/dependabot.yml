version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per ecosystem cluster rather than a PR per package.
      next:
        patterns: ["next", "next-*", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss", "autoprefixer"]
      dev-tooling:
        dependency-type: development
    # Majors that are known-breakable for this repo, so Dependabot stops
    # opening PRs that fail CI (see #90). Drop each ignore once its migration
    # has landed:
    #   - typescript 7 removed the JS compiler API that
    #     apps/client/src/scripts/checkEnvVars.ts imports at runtime, plus the
    #     moduleResolution=node10 / baseUrl options the tsconfigs still use.
    #   - @types/node must track the pinned Node major (engines, CI setup-node
    #     and Vercel are all on 22), so a 26.x would type-check against APIs
    #     the runtime does not have.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
