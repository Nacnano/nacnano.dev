version: 2
updates:
  # The Bun ecosystem (not npm): this repo is Bun-managed (bun.lock +
  # packageManager) and Dependabot's npm_and_yarn updater cannot write
  # bun.lock — it shipped #90 with edited package.json files and a stale
  # lockfile, then started failing its weekly update outright.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per ecosystem cluster rather than a PR per package.
      next:
        patterns: ["next", "next-*", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*", "postcss", "autoprefixer"]
      dev-tooling:
        dependency-type: development
    # Majors that are known-breakable for this repo, so Dependabot stops
    # opening PRs that fail CI. Drop each ignore once its blocker is resolved:
    #   - @types/node must track the pinned Node major (engines, CI setup-node
    #     and Vercel are all on 22), so a 26.x would type-check against APIs
    #     the runtime does not have. Raise this when the Node runtime moves.
    # (typescript 7 was unblocked by the migration in the commit that adds
    # this comment: tsconfigs moved to bundler resolution and checkEnvVars.ts
    # moved off the removed JS compiler API onto typescript/unstable/ast.)
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
