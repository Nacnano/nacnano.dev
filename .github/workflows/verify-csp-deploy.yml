name: Verify production CSP

# After a production deploy, fetch the live site and fail if any page's inline
# script is blocked by the policy that page was served with.
#
# The CI job in `ci.yml` already runs `verify:csp`, but against `next start`
# on the runner. That build writes HTML to `.next/server/app`. Vercel writes
# it somewhere else, and a policy hashed from the wrong files ships green —
# which is how every page was broken for 17 days while CI stayed green. This
# job is the check that sees the HTML visitors get.
#
# It is deliberately not a pull-request check. It runs once the production
# deploy exists, so it cannot be a required status on the merge queue: a
# required check that never runs on a PR blocks the PR. The signal is a red
# workflow on the deploy commit.
#
# The URL is the public site, not `deployment_status.environment_url`. Vercel
# reports a `*.vercel.app` deployment URL, and Deployment Protection answers
# that with a redirect to vercel.com/sso-api. `www.nacnano.dev` is the site
# the deploy just became. The build id is the commit SHA (`generateBuildId`),
# and Next embeds it in every page, so we wait until the HTML contains this
# deploy's SHA before checking — otherwise a slow alias flip would verify the
# previous deploy and pass.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-csp-production
  cancel-in-progress: true

jobs:
  verify:
    name: verify:csp · production
    # Preview deployments are behind the same login wall, so only Production
    # has a URL this job can fetch. `workflow_dispatch` re-checks whatever
    # production is serving right now.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # `github.sha` on a deployment_status event is the default branch,
          # which may not be the commit that just deployed.
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Wait until production serves this deploy
        if: github.event_name == 'deployment_status'
        env:
          SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ -z "$SHA" ]; then
            echo "This deployment has no commit SHA to wait for." >&2
            exit 1
          fi
          for _ in $(seq 1 60); do
            if curl -fsS https://www.nacnano.dev/ | grep -F -q "$SHA"; then
              exit 0
            fi
            sleep 5
          done
          echo "https://www.nacnano.dev is not serving $SHA" >&2
          exit 1

      - name: Verify Content-Security-Policy
        working-directory: apps/client
        env:
          VERIFY_CSP_URL: https://www.nacnano.dev
        run: bun run verify:csp
