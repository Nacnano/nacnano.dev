name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version in Vercel's build image so CI and production
          # resolve the lockfile identically. bun.lock must stay lockfileVersion 1.
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          # Exact, not `**/bun.lock` — a single-lockfile repo, and the key must
          # be deterministic (a broad glob could match a lockfile under
          # node_modules and make the cache key depend on install contents).
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      # A real gate, not decoration: bun exits non-zero on *any* advisory, so a
      # bare `bun audit` would fail on today's two transitive moderates and force
      # a `continue-on-error` that also swallows a critical. Scoping to
      # `--audit-level=high` still prints moderates for information but reddens
      # the build only on a high/critical. Verified to exit 0 on the current
      # tree, so it is green on day one.
      - name: Dependency audit
        run: bun audit --audit-level=high

      # Cheap, catches the Prettier gate before the slower steps run.
      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Last, because it is the slowest and the cheap gates should fail first.
      - name: Build
        run: bun run build

  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      # The suite talks to a real `next start` in static mode, so build first.
      - name: Build
        run: bun run build

      - name: Install browsers
        working-directory: apps/client
        run: bun run e2e:install

      - name: e2e
        working-directory: apps/client
        run: bun run e2e
