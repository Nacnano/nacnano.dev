name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version in Vercel's build image so CI and production
          # resolve the lockfile identically. bun.lock must stay lockfileVersion 1.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      # Surface known advisories between Dependabot's passes. Advisory-only for
      # now (transitive moderates aren't all bumpable yet), so a finding warns
      # rather than reddens — but it is never silently skipped.
      - name: Dependency audit
        continue-on-error: true
        run: bun audit

      # Cheap, catches the Prettier gate before the slower steps run.
      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Last, because it is the slowest and the cheap gates should fail first.
      - name: Build
        run: bun run build
