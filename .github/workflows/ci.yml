name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version in Vercel's build image so CI and production
          # resolve the lockfile identically. bun.lock must stay lockfileVersion 1.
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          # Exact, not `**/bun.lock` — a single-lockfile repo, and the key must
          # be deterministic (a broad glob could match a lockfile under
          # node_modules and make the cache key depend on install contents).
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      # A real gate, not decoration: bun exits non-zero on *any* advisory, so a
      # bare `bun audit` would fail on today's two transitive moderates and force
      # a `continue-on-error` that also swallows a critical. Scoping to
      # `--audit-level=high` still prints moderates for information but reddens
      # the build only on a high/critical. Verified to exit 0 on the current
      # tree, so it is green on day one.
      - name: Dependency audit
        run: bun audit --audit-level=high

      # Cheap, catches the Prettier gate before the slower steps run.
      - name: Format
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # Last, because it is the slowest and the cheap gates should fail first.
      - name: Build
        run: bun run build

      # Serve that build and check, per page, that every inline script it emits
      # is allowed by the policy it was served with.
      #
      # This is not a duplicate of `e2e/csp.e2e.ts`, which watches for real
      # `securitypolicyviolation` events in a browser. Measured: delete the
      # /ama JSON-LD hash from the manifest, rebuild, and the browser suite
      # still passes — a `type="application/ld+json"` block is a data block,
      # never prepared as a script, so a missing hash for it yields no refusal
      # and no violation event. This check compares served policy against
      # served markup directly, so it fails on exactly that drift.
      - name: Verify Content-Security-Policy
        working-directory: apps/client
        run: |
          bun run start &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && break
            sleep 1
          done
          bun run verify:csp

  e2e:
    name: e2e · playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      # The suite talks to a real `next start` in static mode, so build first.
      - name: Build
        run: bun run build

      - name: Install browsers
        working-directory: apps/client
        run: bun run e2e:install

      - name: e2e
        working-directory: apps/client
        run: bun run e2e

      # Keep the failure evidence: traces and videos are captured on the retry
      # after a failure and screenshots on failure, so upload them whenever the
      # suite goes red.
      - name: Upload Playwright artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/client/test-results/
            apps/client/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  perf:
    name: lighthouse · budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-

      - name: Install
        run: bun install --frozen-lockfile

      # Lighthouse measures the production server, so build first — the same
      # artifact that ships, not a dev server. The runner's preinstalled Chrome
      # is used via chrome-launcher; `--no-sandbox` is set in lighthouserc.json.
      - name: Build
        run: bun run build

      # Report-only: every assertion is `warn`, so this records the Core Web
      # Vitals and resource budgets and uploads them without gating the merge.
      # Promote an individual budget to `error` only once it has proven stable
      # across several runs (see lighthouserc.json).
      #
      # `bun run perf` fetches `@lhci/cli` at an exact version via bunx rather
      # than a committed dependency, so it resolves from the network at CI time
      # and is not covered by bun.lock's integrity hashes. Accepted knowingly,
      # not an oversight: this is a report-only job that ships nothing, its
      # result never gates a merge, and pinning the version keeps it from
      # drifting. Revisit (pin by digest, or commit it as a devDependency) if
      # this ever becomes an error-gating gate or a supply-chain input.
      - name: Lighthouse CI
        working-directory: apps/client
        run: bun run perf

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/client/.lighthouseci/
          retention-days: 7
          if-no-files-found: ignore
